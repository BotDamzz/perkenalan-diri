<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Favorite Songs</title>

    <link rel="stylesheet" href="music.css">
</head>

<body>

    <div class="music-page">

        <a href="index.html" class="back-btn">
            ← Kembali
        </a>

        <div class="music-container">

            <p class="mini-title">MY PLAYLIST</p>

            <h1>Favorite <span>Songs</span></h1>

            <p class="subtitle">
                Beberapa lagu favorit saya 🎧
            </p>


            <!-- PLAYER -->

            <div class="player">

                <div class="cover-wrapper">

                    <img
                        id="cover"
                        src="images/cover1.jpg"
                        alt="Cover lagu"
                    >

                    <div class="disc-glow"></div>

                </div>


                <div class="song-info">

                    <h2 id="songTitle">
                        Lagu Favorit 1
                    </h2>

                    <p id="artist">
                        Artist 1
                    </p>

                </div>


                <!-- PROGRESS -->

                <div class="progress-area">

                    <span id="currentTime">
                        0:00
                    </span>

                    <input
                        type="range"
                        id="progress"
                        value="0"
                        min="0"
                        max="100"
                    >

                    <span id="duration">
                        0:00
                    </span>

                </div>


                <!-- CONTROLS -->

                <div class="controls">

                    <button id="prevBtn">
                        ⏮
                    </button>

                    <button
                        id="playBtn"
                        class="play-btn"
                    >
                        ▶
                    </button>

                    <button id="nextBtn">
                        ⏭
                    </button>

                </div>


                <!-- VOLUME -->

                <div class="volume">

                    <span>🔊</span>

                    <input
                        type="range"
                        id="volume"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.8"
                    >

                </div>


                <audio id="audio"></audio>

            </div>


            <!-- PLAYLIST -->

            <div class="playlist">

                <h3>Playlist Saya</h3>


                <div id="playlistItems"></div>

            </div>

        </div>

    </div>


    <script src="music.js"></script>

</body>
</html>
